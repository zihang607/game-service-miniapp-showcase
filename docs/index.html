<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="游戏服务小程序的公开项目演示，体验服务分类、搜索和规格详情。">
  <title>服务目录 · Game Service Miniapp</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrapper masthead">
      <span class="brand"><span class="brand-mark" aria-hidden="true">G</span> 游戏服务</span>
      <a href="https://github.com/zihang607/game-service-miniapp-showcase">项目源码</a>
    </div>
  </header>
  <main class="wrapper">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">微信小程序 · 模拟数据演示</p>
      <h1 id="page-title">发现游戏服务</h1>
      <p class="intro-copy">从多人协作到新手训练，按分类浏览服务，查看适合自己的规格。</p>
      <label class="search" for="service-search">
        <span class="search-icon" aria-hidden="true"></span>
        <span class="visually-hidden">搜索服务</span>
        <input id="service-search" type="search" placeholder="搜索服务，例如：教学" autocomplete="off">
      </label>
    </section>
    <section class="catalog" aria-labelledby="catalog-title">
      <div class="catalog-heading"><h2 id="catalog-title">服务目录</h2><p id="result-count" role="status"></p></div>
      <div class="filters" id="service-filters" role="group" aria-label="服务分类"></div>
      <ul class="service-list" id="service-list"></ul>
      <div class="empty" id="empty-state" hidden>
        <h3>没有找到匹配的服务</h3>
        <button id="reset-filters" type="button">清除搜索和筛选</button>
      </div>
      <noscript>请启用 JavaScript 以浏览演示目录。</noscript>
    </section>
  </main>
  <dialog id="service-detail" aria-labelledby="detail-title">
    <form method="dialog"><button class="close" aria-label="关闭服务详情" autofocus>×</button></form>
    <p class="eyebrow" id="detail-category"></p>
    <h2 id="detail-title"></h2>
    <p class="detail-description" id="detail-description"></p>
    <h3>可选规格</h3>
    <ul class="spec-list" id="detail-specs"></ul>
  </dialog>
  <template id="service-template">
    <li>
      <button class="service-card" type="button">
        <span class="service-category"></span>
        <span class="service-name"></span>
        <span class="service-summary"></span>
        <span class="card-footer"><span class="service-price"></span><span aria-hidden="true">查看详情 →</span></span>
      </button>
    </li>
  </template>
</body>
</html>
